name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.13 quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Lint
        run: python -m ruff check backend/src tests

      - name: Check formatting
        run: python -m black --check backend/src tests

      - name: Type-check
        run: python -m mypy backend/src tests

      - name: Test
        run: python -m pytest
