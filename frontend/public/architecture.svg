    <g fill="#2563eb" font-size="12" font-weight="700">
      <text x="42" y="122">01</text><text x="237" y="122">02</text><text x="432" y="122">03</text>
      <text x="627" y="122">04</text><text x="822" y="122">05</text><text x="1017" y="122">06</text>
