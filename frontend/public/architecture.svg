<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 380" role="img" aria-labelledby="title desc">
  <title id="title">CEO Voice Platform workflow</title>
  <desc id="desc">Public content moves through ingestion, analysis, the HVM voice profile, profile publication, context compilation, retrieval, generation, Re-Voice, and evaluation. An independent VKR structure library enters only at context compilation.</desc>
